# Copy to /etc/apache2/sites-available/ and replace every example value.
<VirtualHost *:443>
    ServerName kiosk.example.internal

    SSLEngine on
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCertificateFile /etc/ssl/certs/kiosk.example.internal.crt
    SSLCertificateKeyFile /etc/ssl/private/kiosk.example.internal.key

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Proto "https"
    LimitRequestBody 8000000

    # Replace these TEST-NET examples with the approved admin subnet and reserved tablet IP.
    <LocationMatch "^/(admin|api/admin|photos|oauth/microsoft/callback)(/|$)">
        Require ip 192.0.2.0/24
    </LocationMatch>
    <Location "/api/checkins">
        Require ip 198.51.100.10/32
    </Location>

    ProxyPass        / http://127.0.0.1:8080/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog ${APACHE_LOG_DIR}/elite-rf-kiosk-error.log
    CustomLog ${APACHE_LOG_DIR}/elite-rf-kiosk-access.log combined
</VirtualHost>
